# Toolchain choice (differs from the Capacitor 8 template's Gradle 8.14 + AGP 8.13):
# - Android Studio 2026.2 bundles only JBR 25, and Gradle 8.x can't run on Java 25.
# - AGP 8.x can't run on Gradle >= 9.6 (it uses a Gradle internal API removed in 9.6).
# So: Gradle 9.7 + AGP 9.5 (built-in Kotlin). The Capacitor library modules
# (capacitor-android, @capacitor/app) build unchanged on AGP 9.5.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
