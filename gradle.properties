# Project-wide Gradle settings.
#
# Kept small on purpose: the dev machine has little free RAM, and a debug
# build of this app fits comfortably in ~1.3 GB.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Compile Kotlin inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
